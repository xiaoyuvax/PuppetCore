name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet: ['8.0.x', '10.0.x']
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Setup NuGet sources (local Wima packages fallback)
        shell: pwsh
        run: |
          # 仓库 NuGet.config 引用本地目录 D:\PUB\Nuget Packages（仅本机存在）。
          # CI 上还原走 nuget.org；若 Wima.* 包未发布到 nuget.org，则此步失败并给出明确提示。
          Write-Host "Using repo NuGet.config; CI restores from nuget.org"

      - name: Restore
        run: dotnet restore PuppetCore.slnx

      - name: Build (Release)
        run: dotnet build PuppetCore.slnx -c Release --no-restore

      - name: Test (net8.0 + net10.0 per matrix TFM availability)
        run: dotnet test tests/Puppet.Core.Tests/Puppet.Core.Tests.csproj -c Release --no-build
