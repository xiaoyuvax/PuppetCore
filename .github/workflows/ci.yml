name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet: ['8.0.x', '10.0.x']
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # 仓库 NuGet.config 含本机源 D:\PUB\Nuget Packages（CI 不存在）。
      # CI 还原显式指定 nuget.org 覆盖之；Wima.* 依赖均已发布到 nuget.org（实测 200）。
      - name: Restore (nuget.org only; bypass local machine source)
        run: dotnet restore PuppetCore.slnx --source https://api.nuget.org/v3/index.json

      - name: Build (Release)
        run: dotnet build PuppetCore.slnx -c Release --no-restore --source https://api.nuget.org/v3/index.json

      - name: Test
        run: dotnet test tests/Puppet.Core.Tests/Puppet.Core.Tests.csproj -c Release --no-build
